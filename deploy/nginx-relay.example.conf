# Example nginx front for goon.vc (HTML zipper + Hub API proxy).
# Fabric Peer is not on this host. relay.goon.vc is a separate LiveRelay
# process — see star-citizen-live/docs/PRODUCTION.md.
#
# Include from the http {} context (map + upstream + server).

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

upstream goonvc_site {
	server 127.0.0.1:8080;
	keepalive 32;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name goon.vc;

	# ssl_certificate /…;
	# ssl_certificate_key /…;

	client_max_body_size 4m;

	location / {
		proxy_pass http://goonvc_site;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Origin $http_origin;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}
